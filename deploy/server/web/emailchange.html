<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/styles.css">
    <title>Change email address - OpenShores</title>
</head>
<body>
    <main>
        <h1>Change email address</h1>
        <form method="post" action="/cgi-bin/AuAcctEmail" accept-charset="UTF-8">
            <label>Account name <input name="acctname" autocomplete="username" required></label>
            <label>Current password <input type="password" name="password" autocomplete="current-password" required></label>
            <label>New email address <input type="email" name="newemail" autocomplete="email" required></label>
            <button type="submit">Change email address</button>
        </form>
        <p><a href="/">Home</a></p>
    </main>
</body>
</html>
